# Railway config as code for the Generic Corp app service.
# Railway reads this file from the repository root. Runbook:
# apps/generic-corp/DEPLOY.md. Settings that cannot live here (the Postgres
# database, the volume, variables and the public domain) are listed there.
"$schema" = "https://railway.com/railway.schema.json"

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/generic-corp/Dockerfile"

[deploy]
# Apply Postgres schema migrations before the new deployment takes traffic.
# A failed migration fails the deploy and leaves the old one running.
preDeployCommand = ["node apps/generic-corp/dist/migrate.js"]
# Railway waits for this to answer 200 before switching traffic. /ready checks
# the database connection and schema version.
healthcheckPath = "/ready"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
