        content: |-
          # European home battery storage: market brief

          ## In short

          Europe's home battery market is large and still growing. It was about 12 GWh, worth
          about EUR 7.5 billion, in 2025, and is expected to grow about 15% a year to 2030
          ([Example Energy Institute](https://energy-institute.example/home-storage-outlook-2026)).
          Three vendors sell most systems. The biggest risks are policy changes and the supply
          of installers.

          ## Size and growth

          - Installed in 2025: about 12 GWh of residential storage, worth about EUR 7.5 billion
            ([Example Energy Institute](https://energy-institute.example/home-storage-outlook-2026)).
          - Expected growth: about 15% a year to 2030, from the same outlook.
          - Demand comes mostly from homes that already have solar panels. Lower feed-in tariffs
            in four countries make storing solar power worth more than selling it
            ([Example Policy Review](https://policy-review.example/tariffs-home-storage)).
          - Battery cells keep getting cheaper, which lowers system prices each year
            ([Example Commodities Desk](https://commodities.example/cell-prices-2026)).

          ## Main players

          Voltara, Nordcell and Helio Home together sold 58% of residential systems in 2025
          ([Example Market Watch](https://market-watch.example/home-battery-vendors)).

          - **Voltara** sells complete kits through large installers and competes on price.
          - **Nordcell** sells premium systems with long warranties, mostly in the north.
          - **Helio Home** bundles batteries with its own solar panels and an energy app.

          The rest of the market is split between many smaller brands and installers who
          assemble their own systems.

          ## Risks

          1. **Subsidy cuts.** Several countries pay part of the cost of a home battery. If those
             programmes end early, demand would drop for a year or two while prices adjust.
          2. **Tariffs could reverse.** The case for storage rests on low feed-in tariffs. A
             return to higher tariffs would make selling power more attractive than storing it
             ([Example Policy Review](https://policy-review.example/tariffs-home-storage)).
          3. **Installer shortages.** Installation, not hardware, already limits growth in some
             regions. Long waiting times push buyers to delay.
          4. **Price pressure.** Falling cell prices help buyers but squeeze margins for vendors
             that compete on price.

          ## What this means

          The market is attractive for a new entrant that can offer installation capacity, not
          only hardware. Watch subsidy decisions in the largest markets over the next year, since
          they will move demand more than any product change.

          ## Sources

          - Example Energy Institute, Home battery storage outlook 2026:
            https://energy-institute.example/home-storage-outlook-2026
          - Example Market Watch, Who sells home batteries in Europe:
            https://market-watch.example/home-battery-vendors
          - Example Policy Review, Grid tariffs and home storage:
            https://policy-review.example/tariffs-home-storage
          - Example Commodities Desk, Battery cell prices:
            https://commodities.example/cell-prices-2026
    - call: stop_and_respond
      args:
        response: >-
          Done. The brief is at workspace/home-battery-brief.md, about 450 words, with four
          linked sources.
