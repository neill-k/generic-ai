title: Generic Corp goal evals
description: >-
  Replays the default company's goals through the whole org chart, from the CEO to the
  individual contributors, and scores numeric outcomes, rubric grades and required actions.
# Live runs: five attempts per case, and three in a row must pass at least half the time.
# The offline replay is deterministic, so CI runs it once per case.
trials:
  count: 5
  passK: 3
gate:
  minPassRate: 0.8
  minPassK: 0.5
  maxIntegrityViolations: 0
cases:
  - id: launch-plan
    goal: launch-plan
    replay: replays/launch-plan.yaml
    holdoutValidators:
      - id: plan-has-substance
        kind: numeric
        description: The plan is more than a table, at least 120 words.
        source: { metric: deliverableWords }
        operator: gte
        value: 120
  - id: tool-comparison
    goal: tool-comparison
    replay: replays/tool-comparison.yaml
    holdoutValidators:
      - id: one-file
        kind: output_schema
        description: The comparison is handed in as a single file.
        schema:
          type: object
          required: [deliverables]
          properties:
            deliverables: { type: array, minItems: 1, maxItems: 1 }
