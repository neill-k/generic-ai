<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Generic Corp</title>
    <link rel="stylesheet" href="/classic/assets/styles.css" />
    <script type="module" src="/classic/assets/app.js"></script>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">G</div>
          <div>
            <div class="brand-name" id="company-name">Generic Corp</div>
            <div class="brand-tagline" id="company-tagline">We care deeply about our employees.</div>
          </div>
        </div>
        <nav class="nav" aria-label="Main">
          <a href="#/chat" data-view="chat">Chat with the CEO</a>
          <a href="#/permissions" data-view="permissions">Permissions</a>
          <a href="#/deliverables" data-view="deliverables">Deliverables</a>
          <a href="#/drive" data-view="drive">Drive</a>
          <a href="#/org" data-view="org">Org chart</a>
          <a href="#/board" data-view="board">Board</a>
          <a href="#/costs" data-view="costs">Costs</a>
          <a href="#/tools" data-view="tools">Tools</a>
          <a href="#/power" data-view="power">Claude sign-in</a>
          <a href="#/secrets" data-view="secrets">Secrets</a>
        </nav>
        <div class="sidebar-footer">
          <span class="live" id="live-status" title="Live updates">Connecting…</span>
          <a href="/auth/login">Account</a>
        </div>
      </aside>
      <main class="main" id="view" tabindex="-1"></main>
    </div>
    <div class="drawer" id="drawer" hidden>
      <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
        <div class="drawer-header">
          <h2 id="drawer-title"></h2>
          <button type="button" class="ghost" id="drawer-close" aria-label="Close">Close</button>
        </div>
        <div class="drawer-body" id="drawer-body"></div>
      </div>
    </div>
  </body>
</html>
