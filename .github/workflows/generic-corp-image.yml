name: generic-corp-image

# Builds the production image Railway deploys and smoke-tests it against
# Postgres, including headless Chrome for the browser connector.

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/generic-corp/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".dockerignore"
      - "railway.toml"
      - ".github/workflows/generic-corp-image.yml"
  push:
    branches:
      - main
    paths:
      - "apps/generic-corp/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".dockerignore"
      - "railway.toml"
      - ".github/workflows/generic-corp-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generic-corp-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image-smoke:
    name: image-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -f apps/generic-corp/Dockerfile -t generic-corp:ci .

      - name: Report image size
        run: docker image ls generic-corp:ci

      - name: Smoke test against Postgres
        run: apps/generic-corp/scripts/smoke-image.sh generic-corp:ci --browser
