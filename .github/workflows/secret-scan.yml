name: secret-scan

# Fails the build when a secret (API key, token, private key) is committed,
# in any commit of the branch's history. gitleaks is downloaded at a pinned
# version and checked against its published SHA-256.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.24.3
      GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
    steps:
      - name: Check out repository with history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      # Canary: a token made up at run time (never committed) must fail the
      # scan, so a broken scanner or config cannot pass silently.
      - name: Check the scanner catches a committed token
        run: |
          canary="$RUNNER_TEMP/canary"
          mkdir -p "$canary"
          token="ghp_$(head -c 64 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 36)"
          printf 'GITHUB_TOKEN=%s\n' "$token" > "$canary/config.env"
          if gitleaks dir "$canary" --no-banner --redact --exit-code 1 >/dev/null 2>&1; then
            echo "gitleaks did not flag a fake GitHub token"
            exit 1
          fi

      - name: Scan every commit for secrets
        run: gitleaks git . --no-banner --redact --verbose --exit-code 1
