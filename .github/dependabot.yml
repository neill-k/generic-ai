version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 10
    ignore:
      # @types/node tracks the Node runtime the repo targets (Node 24, see package.json engines).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript majors (7 is the native compiler) are planned migrations, not routine bumps.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      production-major-updates:
        dependency-type: "production"
        update-types:
          - "major"
        patterns:
          - "*"
      production-non-major-updates:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      development-major-updates:
        dependency-type: "development"
        update-types:
          - "major"
        patterns:
          - "*"
      development-non-major-updates:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Chicago"
